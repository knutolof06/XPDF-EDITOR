    <title>XPDF - Gelişmiş PDF Editör & Görüntüleyici</title>
    <script>(function(){try{var r=localStorage.getItem('xpdf_settings');var t=null;if(r){try{t=JSON.parse(r).theme;}catch(e){}}if(!t){t=localStorage.getItem('xpdf_theme')||'dark';}if(t==='dark'||(t==='system'&&window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.classList.add('dark');document.documentElement.classList.remove('light');}else{document.documentElement.classList.remove('dark');document.documentElement.classList.add('light');}}catch(e){}})();</script>
