name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (örn: v1.5.8)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    name: 🪟 Windows Build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Build Windows Installer & Portable EXE
        run: npx electron-builder --win nsis portable --x64

      - name: Create Windows Portable ZIP
        run: |
          Compress-Archive -Path "release\win-unpacked\*" -DestinationPath "XPDF-Editor-Windows-x64-Portable.zip" -Force
          $origExe = Get-Item "release\XPDF Editor *.exe" | Select-Object -First 1
          if ($origExe) {
            Copy-Item $origExe.FullName -Destination "release\XPDF-Editor-Portable.exe"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            release/XPDF-Editor-Kurulum-Setup.exe
            release/XPDF-Editor-Kurulum-Setup.exe.blockmap
            release/XPDF-Editor-Portable.exe
            release/latest.yml
            XPDF-Editor-Windows-x64-Portable.zip

  build-macos:
    name: 🍎 macOS Build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Package macOS App
        run: |
          npx @electron/packager . "XPDF Editor" \
            --platform=darwin \
            --arch=x64 \
            --out=release \
            --overwrite \
            --asar=false \
            --prune=true \
            --icon=build/icon.icns \
            --ignore="^/\.git" \
            --ignore="^/release" \
            --ignore="^/\.gemini"

      - name: Create macOS ZIP
        run: |
          cd release
          zip -r ../XPDF-Editor-macOS-x64.zip "XPDF Editor-darwin-x64"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: XPDF-Editor-macOS-x64.zip

  release:
    name: 🚀 Create GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-build

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: macos-build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: "XPDF Editor ${{ inputs.tag_name || github.ref_name }}"
          body: |
            ## 🚀 XPDF Editor ${{ inputs.tag_name || github.ref_name }}

            Modern, hızlı ve güçlü PDF Düzenleyici & Yöneticisi.

            ### 📥 İndirme Seçenekleri

            | Platform | Dosya | Açıklama |
            |----------|-------|----------|
            | 🪟 Windows | `XPDF-Editor-Kurulum-Setup.exe` | Windows Otomatik Kurulum Paketi (Önerilen) |
            | 🪟 Windows | `XPDF-Editor-Portable.exe` | Kurulumsuz Tekil Çalıştırılabilir EXE |
            | 🪟 Windows | `XPDF-Editor-Windows-x64-Portable.zip` | Kurulumsuz Taşınabilir ZIP Arşivi |
            | 🍎 macOS | `XPDF-Editor-macOS-x64.zip` | macOS 64-bit Uygulama Paketi |

            ### 🪟 Windows Kurulumu
            - **Kurulum paketi için:** `XPDF-Editor-Kurulum-Setup.exe` dosyasını çalıştırın.
            - **Taşınabilir versiyon için:** `XPDF-Editor-Windows-x64-Portable.zip` dosyasını ayıklayın ve `XPDF Editor.exe` dosyasını çalıştırın.
            - PDF ilişkilendirmesi için klasör içindeki `Varsayilan-PDF-Yap-Ve-Onizlemeleri-Ac.bat` dosyasını çalıştırabilirsiniz.

            ### 🍎 macOS Kurulumu
            1. `XPDF-Editor-macOS-x64.zip` dosyasını indirin ve ayıklayın
            2. `XPDF Editor.app` dosyasını Uygulamalar klasörüne taşıyın
            3. İlk açılışta sağ tıklayıp "Aç" seçeneğini kullanın (Gatekeeper bypass)
          files: |
            XPDF-Editor-Kurulum-Setup.exe
            XPDF-Editor-Kurulum-Setup.exe.blockmap
            XPDF-Editor-Portable.exe
            latest.yml
            XPDF-Editor-Windows-x64-Portable.zip
            XPDF-Editor-macOS-x64.zip
          draft: false
          prerelease: false
