name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (örn: v1.5.8)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  verify:
    name: ✅ Typecheck, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: ESLint check
        run: npm run lint

      - name: Unit tests
        run: npm test

  build-windows:
    name: 🪟 Windows Build
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Build Windows Installer & Portable EXE
        run: npx electron-builder --win nsis portable --x64

      - name: Create Windows Portable ZIP
        run: |
          Compress-Archive -Path "release\win-unpacked\*" -DestinationPath "XPDF-Editor-Windows-x64-Portable.zip" -Force
          if (!(Test-Path "release\XPDF-Editor-Portable.exe")) {
            $origExe = Get-Item "release\XPDF Editor *.exe" | Select-Object -First 1
            if ($origExe) {
              Copy-Item $origExe.FullName -Destination "release\XPDF-Editor-Portable.exe"
            }
          }
          Get-Content "release\latest.yml"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            release/XPDF-Editor-Kurulum-Setup.exe
            release/XPDF-Editor-Kurulum-Setup.exe.blockmap
            release/XPDF-Editor-Portable.exe
            release/latest.yml
            XPDF-Editor-Windows-x64-Portable.zip

  build-macos:
    name: 🍎 macOS Build
    needs: verify
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Generate macOS .icns icon from build/icon.png
        run: |
          mkdir -p build/icon.iconset
          sips -z 16 16     build/icon.png --out build/icon.iconset/icon_16x16.png
          sips -z 32 32     build/icon.png --out build/icon.iconset/icon_16x16@2x.png
          sips -z 32 32     build/icon.png --out build/icon.iconset/icon_32x32.png
          sips -z 64 64     build/icon.png --out build/icon.iconset/icon_32x32@2x.png
          sips -z 128 128   build/icon.png --out build/icon.iconset/icon_128x128.png
          sips -z 256 256   build/icon.png --out build/icon.iconset/icon_128x128@2x.png
          sips -z 256 256   build/icon.png --out build/icon.iconset/icon_256x256.png
          sips -z 512 512   build/icon.png --out build/icon.iconset/icon_256x256@2x.png
          sips -z 512 512   build/icon.png --out build/icon.iconset/icon_512x512.png
          cp build/icon.png build/icon.iconset/icon_512x512@2x.png
          iconutil -c icns build/icon.iconset -o build/icon.icns
          rm -rf build/icon.iconset

      - name: Package macOS App
        run: |
          npx @electron/packager . "XPDF Editor" \
            --platform=darwin \
            --arch=x64 \
            --out=release \
            --overwrite \
            --asar=true \
            --prune=true \
            --icon=build/icon.icns \
            --ignore="^/\.git($|/)" \
            --ignore="^/\.github($|/)" \
            --ignore="^/\.gemini($|/)" \
            --ignore="^/release($|/)" \
            --ignore="^/src($|/)" \
            --ignore="^/scripts($|/)" \
            --ignore="^/tools($|/)" \
            --ignore="^/build($|/)" \
            --ignore="^/scratch($|/)" \
            --ignore="^/vitest\.config\.ts$" \
            --ignore="^/eslint\.config\.js$" \
            --ignore="^/tsconfig(\.node)?\.json$" \
            --ignore="^/vite\.config\.ts$" \
            --ignore="^/tailwind\.config\.js$" \
            --ignore="^/postcss\.config\.js$" \
            --ignore="^/index\.html$" \
            --ignore="^/manifest\.json$" \
            --ignore="\.md$"

      - name: Create macOS ZIP
        run: |
          cd release
          zip -r ../XPDF-Editor-macOS-x64.zip "XPDF Editor-darwin-x64"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: XPDF-Editor-macOS-x64.zip

  release:
    name: 🚀 Create GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-build

      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: macos-build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: "XPDF Editor ${{ inputs.tag_name || github.ref_name }}"
          body: |
            ## 🚀 XPDF Editor ${{ inputs.tag_name || github.ref_name }}

            Modern, hızlı ve güçlü PDF Düzenleyici & Yöneticisi.

            ### 📥 İndirme Seçenekleri

            | Platform | Dosya | Açıklama |
            |----------|-------|----------|
            | 🪟 Windows | `XPDF-Editor-Kurulum-Setup.exe` | Windows Otomatik Kurulum Paketi (Önerilen) |
            | 🪟 Windows | `XPDF-Editor-Portable.exe` | Kurulumsuz Tekil Çalıştırılabilir EXE |
            | 🪟 Windows | `XPDF-Editor-Windows-x64-Portable.zip` | Kurulumsuz Taşınabilir ZIP Arşivi |
            | 🍎 macOS | `XPDF-Editor-macOS-x64.zip` | macOS 64-bit Uygulama Paketi |

            ### 🪟 Windows Kurulumu
            - **Kurulum paketi için:** `XPDF-Editor-Kurulum-Setup.exe` dosyasını çalıştırın.
            - **Taşınabilir versiyon için:** `XPDF-Editor-Windows-x64-Portable.zip` dosyasını ayıklayın ve `XPDF Editor.exe` dosyasını çalıştırın.
            - Varsayılan PDF uygulaması yapmak için uygulama içinde **Belge Özellikleri** penceresindeki **"XPDF'i Varsayılan PDF Yöneticisi Yap"** düğmesini kullanabilirsiniz.

            ### 🍎 macOS Kurulumu
            1. `XPDF-Editor-macOS-x64.zip` dosyasını indirin ve ayıklayın
            2. `XPDF Editor.app` dosyasını Uygulamalar klasörüne taşıyın
            3. İlk açılışta sağ tıklayıp "Aç" seçeneğini kullanın (Gatekeeper bypass)
          files: |
            XPDF-Editor-Kurulum-Setup.exe
            XPDF-Editor-Kurulum-Setup.exe.blockmap
            XPDF-Editor-Portable.exe
            latest.yml
            XPDF-Editor-Windows-x64-Portable.zip
            XPDF-Editor-macOS-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
